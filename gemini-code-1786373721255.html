<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atelier Global — Bespoke Preview</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

  <header class="navbar">
    <div class="logo">ATELIER GLOBAL</div>
    <nav class="nav-links">
      <a href="#">Customizer</a>
      <a href="#">Designers</a>
      <a href="#">Clearance</a>
    </nav>
  </header>

  <main class="container">
    <section class="viewport-card">
      <div id="dress-preview" class="dress-display">
        <div class="silhouette-placeholder" id="dress-silhouette"></div>
      </div>
      <p class="viewport-hint">Interactive Material Preview</p>
    </section>

    <section class="controls-card">
      <div class="header-group">
        <h1>Bespoke Dress Customizer</h1>
        <p class="subtitle">Select dynamic materials and fabric hues.</p>
      </div>

      <div class="control-group">
        <label class="control-label">Fabric Color Engine</label>
        <div class="color-palette">
          <button class="color-swatch active" data-color="#5C4033" style="background-color: #5C4033;" title="Accent Brown"></button>
          <button class="color-swatch" data-color="#4A5D4E" style="background-color: #4A5D4E;" title="Sage Green"></button>
          <button class="color-swatch" data-color="#E8C5C8" style="background-color: #E8C5C8;" title="Dusty Pink"></button>
          <button class="color-swatch" data-color="#1A1A1A" style="background-color: #1A1A1A;" title="Onyx Black"></button>
        </div>

        <div class="hex-input-group">
          <span>HEX:</span>
          <input type="text" id="hex-input" value="#5C4033" maxlength="7" />
        </div>
      </div>

      <div class="button-group">
        <button class="btn btn-primary" id="scan-btn">Launch AI Camera Scanner</button>
        <button class="btn btn-outline" id="consult-btn">Consult Global Designer</button>
      </div>

      <div class="checkout-wrapper">
        <button class="btn btn-accent" id="checkout-btn">Proceed to Bespoke Checkout</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
